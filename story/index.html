<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ストーリーズ作成">
<meta name="theme-color" content="#1c1f26">
<link rel="apple-touch-icon" href="../img/owner-icon-180.png?v=cbb1087e">
<link rel="icon" type="image/png" sizes="512x512" href="../img/owner-icon-512.png?v=7972b6a3">
<link rel="icon" type="image/png" sizes="64x64" href="../img/owner-icon-64.png?v=ce05c3fc">
<title>ストーリーズ作成｜T3 Works</title>
<link rel="stylesheet" href="../css/style.css?v=ff0a159c">
<link rel="stylesheet" href="css/story.css?v=55f08ac0">
<meta name="app-version" content="0bc328ef">
</head>
<body class="no-daytabs app-story" data-assets="../">

<!-- ===== ヘッダー ===== -->
<header class="app-header">
  <div class="app-header__inner">
    <div class="app-title">
      <span class="logo-chip logo-chip--app"><img src="../img/owner-icon-64.png?v=ce05c3fc" alt=""></span>
      <span class="app-title__text">
        <span class="app-title__main">ストーリーズ作成</span>
        <span class="app-title__sub">T3Dining｜インスタ</span>
      </span>
    </div>
    <div class="header-actions">
      <!-- オーナー（ホーム）から来たときだけ出します（配達記録と同じ考え方） -->
      <a class="settings-btn is-hidden" id="toOwnerBtn" href="../owner/" title="ホーム（アプリを選ぶ画面）に戻る">
        <span aria-hidden="true">🏠</span><span>ホーム</span>
      </a>
    </div>
  </div>
</header>

<main class="story-main">

  <!-- ===== 1. 店舗を選ぶ ===== -->
  <section class="story-view" id="viewStores">
    <div class="stores-head">
      <h1 class="stores-head__title">店舗を選んでください</h1>
      <p class="stores-head__date" id="madeOn"></p>
    </div>
    <div class="story-stores" id="storeList"></div>
  </section>

  <!-- ===== 2. 画像を選ぶ ===== -->
  <section class="story-view is-hidden" id="viewList">
    <button type="button" class="story-back" id="backToStores">‹ 店舗を選びなおす</button>
    <div class="stores-head">
      <h1 class="stores-head__title"><span id="storeName"></span>の画像</h1>
      <p class="stores-head__date" id="listNote"></p>
    </div>
    <ul class="story-cards" id="imageList"></ul>
  </section>

  <!-- ===== 3. 大きく出して保存 ===== -->
  <section class="story-view is-hidden" id="viewDone">
    <button type="button" class="story-back" id="backToList">‹ ほかの画像を選ぶ</button>
    <p class="story-done-note">画像を長押しして［写真に保存］を選んでください。</p>
    <p class="story-done-name" id="resultName"></p>
    <div class="story-result"><img id="resultImg" alt="ストーリーズ用の画像"></div>
    <a class="story-download" id="downloadLink" download>パソコンならこちら（ダウンロード）</a>
  </section>

  <p class="story-error is-hidden" id="errorBox"></p>
</main>

<script src="js/story.js?v=72d03613"></script>
</body>
</html>

# 毎日きまった時刻（10:00と17:00）に、1枚ずつInstagramのストーリーズへ投稿します。
#
# 画像はすでに公開してあるものを使うので、ここではChromeもフォントも要りません。
# うまくいくと 投稿履歴.json が更新され、次の日は別の画像が選ばれます。
#
# 必要な Secrets（リポジトリの Settings → Secrets and variables → Actions）
#   IG_USER_ID_BAGURU  … バグるのInstagramユーザーID
#   IG_TOKEN_BAGURU    … バグるのアクセストークン
#   IG_USER_ID_POPO    … popoの分（無ければバグるだけ投稿します）
#   IG_TOKEN_POPO      … popoの分
#
# ★店舗ごとにビジネスポートフォリオが分かれているので、トークンも店舗ごとです。
#
# ★ 仕組みの名前（job の id や入力の名前）は英数字にしないと動きません。
#   画面に出る name: は日本語で大丈夫です。
#
# ★★ このファイルの名前（daily-post.yml）も英数字にしてあります。
#    前は「毎日投稿.yml」でしたが、予定（cron）の実行が3日間で1度も
#    始まりませんでした（手で動かす分は動いていた）。日本語のファイル名を
#    やめたのが直した内容です。ここは英数字のままにしてください。

name: 毎日ストーリーズを投稿

on:
  schedule:
    # ★本線は Google です（gas/通知.gs の startStoryPost が 10:15ごろ・17:15ごろに
    #   workflow_dispatch で起こし、マネージの定休日・臨時休業・臨時営業を closed で渡す）。
    #   ここの予定（cron）は、**Google の回が来なかったときの控え**です。
    #
    # ★控えは、Google の回のあと（その時間帯＋60分より後）に置いています（2026-09-19）。
    #   前は 10:02〜10:32・17:02〜17:32 に置いていましたが、予定の回は休みを知らないので、
    #   Google より先に動くと、臨時休業の日にふつうの画像、臨時営業の日に
    #   「本日定休日です」を出していました。予定の回は、休みを自分で決めず、
    #   Google の回がその日に出したものに従います（投稿する.py の 予定の回の休み）。
    #
    # ★GitHubの予定は何時間も遅れて動きます（2026年9月は、朝の分が14時台、
    #   夕方の分が21時台）。遅れても、投稿する.py が「その時刻までに出ているべき枚数」と
    #   「もう出した枚数」を見くらべて、足りない分だけ出すので、二重には出ません。
    #
    # 朝の控え（日本時間 11:05 / 11:35）
    - cron: "5,35 2 * * *"
    # 夕方の控え（日本時間 18:05 / 18:35）
    - cron: "5,35 9 * * *"
    #
    # ★LINEの見はり（通知.gs の notifyStory）は 10:50ごろ・17:50ごろに動きます。
    #   「Google の回が出せていない」を知らせる役なので、控えより前で構いません。
    #
    # ★時刻を変えるときは、story/設定.json の「投稿する時刻」も同じに直すこと。
    #   出す枚数はそちらの「1日の枚数」と「投稿する時刻」で決まります
    #   （いまは 2枚 ÷ 2回 ＝ 1回1枚）
  workflow_dispatch:
    inputs:
      dry_run:
        description: "投稿せず、何を出すかだけ見る"
        type: boolean
        default: false
      closed:
        description: "きょう休みの店（baguru=定休日 / popo=臨時休業 / baguru=営業）"
        type: string
        default: ""

permissions:
  contents: write          # 投稿履歴.json を書き戻すため

# ★同じ組は1つずつ動かします（2026-09-19）。Google の回と予定の回が重なると、
#   どちらも「まだ出ていない」と数えて二重に出たり、投稿履歴.json の push がぶつかって
#   記録が残らなかったりするため。あとから来た回は、前の回が終わってから始まります
concurrency:
  group: story-post
  cancel-in-progress: false

jobs:
  post:
    name: 投稿する
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 何を投稿するか見る
        if: ${{ github.event.inputs.dry_run == 'true' }}
        env:
          IG_USER_ID_BAGURU: ${{ secrets.IG_USER_ID_BAGURU }}
          IG_TOKEN_BAGURU: ${{ secrets.IG_TOKEN_BAGURU }}
          IG_USER_ID_POPO: ${{ secrets.IG_USER_ID_POPO }}
          IG_TOKEN_POPO: ${{ secrets.IG_TOKEN_POPO }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CLOSED_TODAY: ${{ github.event.inputs.closed }}
          STARTED_BY: ${{ github.event_name }}
        run: python3 投稿する.py --試す

      - name: 投稿する
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          IG_USER_ID_BAGURU: ${{ secrets.IG_USER_ID_BAGURU }}
          IG_TOKEN_BAGURU: ${{ secrets.IG_TOKEN_BAGURU }}
          IG_USER_ID_POPO: ${{ secrets.IG_USER_ID_POPO }}
          IG_TOKEN_POPO: ${{ secrets.IG_TOKEN_POPO }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # きょう休みかどうかは Google 側（マネージの設定）が決めて渡してきます。
          # 予定（cron）で動いたときは空になります。★そのときは休みを自分で決めず、
          # Google の回がきょう出したものに従います（STARTED_BY で見分けます）
          CLOSED_TODAY: ${{ github.event.inputs.closed }}
          STARTED_BY: ${{ github.event_name }}
        run: python3 投稿する.py

      - name: 投稿履歴を残す
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -n "$(git status --porcelain 投稿履歴.json)" ]; then
            # ★書き込む人の名前は GitHub のボット（github-actions[bot]）にしてある（2026-09-19）。
            #   前は ko-dai さん個人の GitHub の転送用アドレスだったので、辞めたあとも
            #   個人の名前で書き込まれ続けるところだった。押す鍵は GitHub が回ごとに配るもので、
            #   人の鍵ではない（上の permissions: contents: write）
            git config user.name "T3Works 自動投稿"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add 投稿履歴.json
            git commit -m "投稿履歴（$(date -u +%Y-%m-%d)）"
            git push
          else
            echo "投稿履歴に変わりはありません"
          fi
